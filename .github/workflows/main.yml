name: Build AntiRevoke Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Theos and SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        rm -rf $HOME/theos/sdks
        git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

    - name: Fix Makefile and Create Control
      run: |
        sed -i '' 's/THEOS_MAKEFILE_PATH/THEOS_MAKE_PATH/g' Makefile
        printf "Package: com.zzy.wxworkantirevoke\nName: WXWorkAntiRevoke\nVersion: 1.0.0\nArchitecture: iphoneos-arm64\nDescription: 企业微信防撤回插件\nMaintainer: Zzy\nAuthor: Zzy\nSection: Tweaks\n" > control

    - name: Build Package
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WXWorkAntiRevoke-Rootless
        path: |
          .theos/obj/*.dylib
          .theos/obj/debug/*.dylib
          packages/*.deb
